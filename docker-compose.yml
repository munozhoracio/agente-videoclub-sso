# Entorno de DESARROLLO (el que toma `docker compose` por defecto).
#
# `name: videoclub` une este stack a la red existente `videoclub_default`
# creada por `springboot-sso/docker/services.yaml`.
# De esta manera, el agente comparte red con Keycloak, Postgres, Gateway, etc.
name: videoclub

services:
    agent:
        build:
            context: .
            dockerfile: Dockerfile
            # Clavado, no parametrizado: las lineas de abajo (bind mount y
            # command: mvn spring-boot:run) solo funcionan sobre la etapa dev.
            target: dev
        container_name: videoclub-agent-dev
        volumes:
            # Bind mount para reflejar cambios de codigo en vivo
            - .:/app
            # Volumen de host para no redescargar dependencias de Maven en cada inicio
            - ~/.m2:/root/.m2
        command: mvn spring-boot:run
        ports:
            - ${PORT}:${PORT}
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            PORT: ${PORT}
            STAGE: ${STAGE}
            OPENAI_API_KEY: ${OPENAI_API_KEY}
            OPENAI_MODEL: ${OPENAI_MODEL}
            OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
            # Un endpoint MCP por servicio desde que el backend se separo en dos.
            # Con default: si el archivo de entorno todavia trae el viejo VIDEOCLUB_MCP_URL,
            # una variable sin definir se expandiria a cadena vacia y pisaria el default del
            # application.yml, dejando al agente sin servidor MCP y sin decir por que.
            # Los hostnames son los nombres de servicio del compose de los backends.
            CATALOG_MCP_URL: ${CATALOG_MCP_URL:-http://catalog:8081/mcp}
            MEMBERSHIP_MCP_URL: ${MEMBERSHIP_MCP_URL:-http://membership:8082/mcp}
            KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
            KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI}
            KEYCLOAK_TOKEN_URL: ${KEYCLOAK_TOKEN_URL}
            KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
            KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
            LANGSMITH_TRACING: ${LANGSMITH_TRACING:-true}
            LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
            LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
            LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-videoclub}
