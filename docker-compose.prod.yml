# Entorno PRODUCTIVO. Se levanta explicitamente con -f y su propio archivo de variables:
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# Variante con imagen nativa (GraalVM). Mismo archivo, otra etapa del Dockerfile:
#   BUILD_TARGET=native-runtime IMAGE_SUFFIX=-native \
#     docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# Ambas variables tienen default, asi que el comando JVM de arriba sigue igual que antes.
# IMAGE_SUFFIX evita que la imagen nativa pise el tag de la JVM.
#
# `name: videoclub-prod` aisla el stack productivo en un namespace propio.
name: videoclub

services:
    agent:
        build:
            context: .
            dockerfile: Dockerfile
            target: ${BUILD_TARGET:-runtime}
        image: videoclub-agent:${APP_VERSION}${IMAGE_SUFFIX:-}
        container_name: videoclub-agent-prod
        ports:
            - ${PORT}:${PORT}
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            PORT: ${PORT}
            STAGE: ${STAGE}
            OPENAI_API_KEY: ${OPENAI_API_KEY}
            OPENAI_MODEL: ${OPENAI_MODEL}
            OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
            # Un endpoint MCP por servicio desde que el backend se separo en dos.
            # Con default: si el archivo de entorno todavia trae el viejo VIDEOCLUB_MCP_URL,
            # una variable sin definir se expandiria a cadena vacia y pisaria el default del
            # application.yml, dejando al agente sin servidor MCP y sin decir por que.
            # Los hostnames son los nombres de servicio del compose de los backends.
            CATALOG_MCP_URL: ${CATALOG_MCP_URL:-http://catalog:8081/mcp}
            MEMBERSHIP_MCP_URL: ${MEMBERSHIP_MCP_URL:-http://membership:8082/mcp}
            KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
            KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI}
            KEYCLOAK_TOKEN_URL: ${KEYCLOAK_TOKEN_URL}
            KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
            KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
            LANGSMITH_TRACING: ${LANGSMITH_TRACING:-true}
            LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
            LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
            LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-videoclub}
        restart: always
