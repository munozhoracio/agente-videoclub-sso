server:
  port: ${PORT:8085}

spring:
  application:
    name: videoclub-agent
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9090/realms/videoclub}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:9090/realms/videoclub/protocol/openid-connect/certs}
  
  ai:
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:demo-key}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.2

    chat:
      observations:
        log-prompt: true
        log-completion: true

      client:
        observations:
          log-prompt: true
          log-completion: true

    tools:
      observations:
        include-content: true

videoclub:
  mcp:
    # Un endpoint MCP por servicio: el backend se separo en catalog-service y
    # membership-service, cada uno con sus propias herramientas.
    catalog-url: ${CATALOG_MCP_URL:http://localhost:8081/mcp}
    membership-url: ${MEMBERSHIP_MCP_URL:http://localhost:8082/mcp}
  keycloak:
    token-url: ${KEYCLOAK_TOKEN_URL:http://localhost:9090/realms/videoclub/protocol/openid-connect/token}
    client-id: ${KEYCLOAK_CLIENT_ID:videoclub-backend}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:dstNSsANvqlaGfZCJa1mcYzP1EBAYP4N}

logging:
  level:
    ar.unrn.video.agent: DEBUG
    org.springframework.security: INFO
    org.springframework.ai: INFO
    io.modelcontextprotocol: INFO

management:
  tracing:
    enabled: true
    sampling:
      probability: ${LANGSMITH_SAMPLING_PROBABILITY:1.0}

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${LANGSMITH_ENDPOINT:https://api.smith.langchain.com}/otel/v1/traces
          headers:
            x-api-key: ${LANGSMITH_API_KEY}
            Langsmith-Project: ${LANGSMITH_PROJECT:videoclub}
          transport: http
          timeout: 30s

  otlp:
    metrics:
      export:
        enabled: false
